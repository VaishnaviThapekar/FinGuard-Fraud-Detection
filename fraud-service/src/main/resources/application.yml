server:
  port: 8083

spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finguard_fraud
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ai:
  ml-service:
    url: http://localhost:8000 # Python FastAPI service running ML models

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
