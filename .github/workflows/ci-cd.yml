name: FinGuard AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Java Services Compilation and Verification
  build-java-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Spring Gateway
      run: |
        cd gateway
        mvn clean verify -B

    - name: Build and Test Auth Service
      run: |
        cd auth-service
        mvn clean verify -B

    - name: Build and Test User Service
      run: |
        cd user-service
        mvn clean verify -B

    - name: Build and Test Fraud Service
      run: |
        cd fraud-service
        mvn clean verify -B

  # 2. Python ML and Agent Services Lint & Test
  build-python-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Fraud ML Engine
      run: |
        cd fraud-service/ml_engine
        pip install -r requirements.txt
        # run python -m pytest if test file exists

    - name: Verify LLM Service
      run: |
        cd llm-service
        pip install -r requirements.txt

    - name: Verify RAG Service
      run: |
        cd rag-service
        pip install -r requirements.txt

    - name: Verify OCR Service
      run: |
        cd ocr-service
        pip install -r requirements.txt

  # 3. Node.js Verification
  build-node-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: notification-service/package-lock.json

    - name: Install and Lint Notification Service
      run: |
        cd notification-service
        npm ci
        # npm run lint / test if configured

  # 4. Frontend Dashboard Build verification
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and Build React App
      run: |
        cd frontend
        npm install
        npm run build
